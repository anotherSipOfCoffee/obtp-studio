<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title description">
 <title id="title">R05 twelve-module Sauna with a wet lobby and two side access candidates</title>
 <desc id="description">Whole-plan research diagram. Opposing side entrances cross the dry changing room. A central door candidate leads to a separate wet lobby, then two doors lead to Sauna and washing. Sauna bench/heater and washing shower are nominal reservations. No openings or partitions are generated.</desc>
