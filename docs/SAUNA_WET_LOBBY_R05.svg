 <text x="574" y="115" class="label">Compared with ten modules</text>
 <text x="574" y="143" class="small">Extra 1,200 mm in length creates a wet lobby.</text>
 <text x="574" y="167" class="small">Sauna and washing keep 1.8 × 2.4 m blocks.</text>
 <text x="574" y="191" class="small">Dry changing keeps 3.6 × 3.0 m allocation.</text>
