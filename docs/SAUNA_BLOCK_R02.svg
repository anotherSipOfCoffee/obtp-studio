 <title id="title">Sauna block R02 nominal equipment fit</title>
 <desc id="description">Nominal 1800 by 2400 millimetre allocated rectangle. Entry candidate at front west, upper and foot benches across rear, reference electric heater against east wall near the front. Coordinates are reservations, not finished construction dimensions.</desc>
