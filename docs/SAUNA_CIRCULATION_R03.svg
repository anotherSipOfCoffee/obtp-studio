<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" role="img" aria-labelledby="title description">
 <title id="title">Three ten-module Sauna whole-plan circulation studies</title>
 <desc id="description">A shared dry transverse passage with two side exterior access reservations; a longitudinal dead-end corridor with one front exterior access; and a longitudinal full-pass corridor with front and rear exterior access reservations. All room blocks are planning allocations, not partitions or doors.</desc>
 <style>
  text{font-family:system-ui,sans-serif;fill:#24332e}.heading{font-size:17px;font-weight:700}.small{font-size:13px}.room{font-size:15px;font-weight:650}.sub{font-size:12px}.edge{fill:none;stroke:#244f40;stroke-width:3;stroke-dasharray:8 5}.door{stroke:#b06a34;stroke-width:8;stroke-linecap:round}.line{stroke:#fffef9;stroke-width:3}
 </style>
