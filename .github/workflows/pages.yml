name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read pinned System version
        id: system
        run: python -c "import json,os; d=json.load(open('system.lock.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('commit='+d['commit']+'\\n')"
      - name: Checkout System source
        uses: actions/checkout@v6
        with:
          repository: anotherSipOfCoffee/obtp-system
          ref: ${{ steps.system.outputs.commit }}
          path: _system
      - name: Prepare pinned System modules
        run: python tools/prepare_system.py
      - name: Install browser verification
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify Studio variations
        run: |
          python -m http.server 8765 --directory dist &
          node tests/variations.cjs
      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-variation-check
          path: studio-v2-*.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
