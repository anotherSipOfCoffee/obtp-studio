name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read pinned System version
        id: system
        run: python -c "import json,os; d=json.load(open('system.lock.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('commit='+d['commit']+'\n')"
      - name: Checkout System source
        uses: actions/checkout@v6
        with:
          repository: anotherSipOfCoffee/obtp-system
          ref: ${{ steps.system.outputs.commit }}
          path: _system
      - run: python -m pip install reportlab rhino3dm==8.35.0
      - name: Test export cache integrity
        run: python -m unittest discover -s tests -p 'test_generated_cache.py'
      - name: Identify canonical export cache
        id: export-key
        run: echo "key=$(python tools/generated_cache.py)" >> "$GITHUB_OUTPUT"
      - name: Restore canonical export
        uses: actions/cache@v4
        with:
          path: dist/v3/generated
          key: ${{ steps.export-key.outputs.key }}
      - name: Prepare pinned System modules
        run: |
          python tools/prepare_system.py
          node _system/tests/catalogue.cjs
          node _system/tests/cassette.cjs
          node _system/tests/matrix.cjs
          node tests/presets.cjs
          node tests/function-screen.cjs
          node tests/subblocks.cjs
          node tools/export_sauna_cad.cjs
      - name: Install browser verification
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Studio variations
        run: |
          python -m http.server 8765 --directory dist &
          node tests/variations.cjs
      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-variation-check
          path: studio-*.png
      - name: Wait for legacy branch Pages build
        uses: actions/github-script@v7
        with:
          script: |
            // Branch publishing is still enabled. Publish the prepared artifact last.
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(r =>
                r.name === 'pages build and deployment' && r.id !== context.runId);
              if (legacy.length && legacy.every(r => r.status === 'completed')) {
                core.info('Legacy branch publishing finished; releasing prepared files.');
                return;
              }
              if (!legacy.length && attempt >= 5) {
                core.info('No legacy branch build; continuing.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Legacy branch Pages build did not finish; refusing competing deployment.');
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published Studio variations
        env:
          OBTP_BASE_URL: https://anothersipofcoffee.github.io/obtp-studio/
        run: |
          for attempt in 1 2 3; do
            node tests/variations.cjs && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Save live verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-live-variation-check
          path: studio-*.png
