<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBTP Studio — Variations</title><style>
*{box-sizing:border-box}body{margin:0;color:#24332e;background:#f5f4ed;font:15px system-ui}header{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid #d8ded3}strong{font-size:23px}button,a{font:inherit;color:inherit}button{background:#fffef9;border:1px solid #b9c6a9;border-radius:8px;padding:10px 16px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #779a41}details{position:relative;margin-left:auto}summary{list-style:none;cursor:pointer;border:1px solid #b9c6a9;border-radius:8px;padding:10px 16px;background:#fffef9}summary::-webkit-details-marker{display:none}nav{position:absolute;right:0;top:48px;width:290px;padding:8px;background:#fffef9;border:1px solid #d8ded3;border-radius:10px;box-shadow:0 12px 30px #24332e25;z-index:2}nav button{width:100%;text-align:left;margin:4px 0}nav button[aria-pressed=true]{background:#244f40;color:white}small{display:block;margin-top:5px;font-size:12px}iframe{border:0;display:block;width:100%;height:calc(100dvh - 78px)}[hidden]{display:none!important}#current{font-size:13px}@media(max-width:550px){header{padding:12px;gap:10px}strong{font-size:19px}#current{max-width:100px;font-size:11px}summary{padding:10px}iframe{height:calc(100dvh - 78px)}}</style></head><body><header><strong>obtp. / studio</strong><span id="current" role="status"></span><details id="variations"><summary role="button">Variations ▾</summary><nav aria-label="Studio variations"><button data-version="v1" aria-pressed="false">v1 · Original Studio<small>Preserved conceptual generator</small></button><button data-version="v2" aria-pressed="false">v2 · WikiHouse<small>Supported assembly from System</small></button></nav></details></header><iframe id="v1" title="Studio v1 — original conceptual generator" hidden></iframe><iframe id="v2" title="Studio v2 — WikiHouse assembly" hidden></iframe><script>
const labels={v1:'v1 · Original reference',v2:'v2 · WikiHouse'};
function select(){const key=location.hash==='#v1'?'v1':'v2';for(const id of ['v1','v2']){const frame=document.getElementById(id);frame.hidden=id!==key;if(id===key&&!frame.getAttribute('src'))frame.src=id+'/index.html';}document.getElementById('current').textContent=labels[key];document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===key)));document.getElementById('variations').open=false;}
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.version;select();});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('variations').open=false;});window.addEventListener('hashchange',select);select();
</script></body></html>
