<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBTP Studio — Variations</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;color:#24332e;background:#f5f4ed;font:15px system-ui}body{display:flex;flex-direction:column}header{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:12px 24px;border-bottom:1px solid #d8ded3}strong{font-size:23px}a{color:inherit;font-size:14px}#current{font-size:13px}iframe{border:0;display:block;width:100%;flex:1;min-height:0}[hidden]{display:none!important}@media(max-width:550px){header{padding:10px 12px;gap:10px}strong{font-size:19px}#current{font-size:11px}}</style></head><body><header><strong>obtp. / studio</strong><span id="current" role="status"></span><a href="https://github.com/anotherSipOfCoffee/obtp-studio" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><iframe id="v1" title="Studio v1 — original conceptual generator" hidden></iframe><iframe id="v2" title="Studio v2 — WikiHouse assembly" hidden></iframe><iframe id="v3" title="Studio v3 — OBTP cassette study" hidden></iframe><script>
const labels={v1:'v1 · Original reference',v2:'v2 · WikiHouse',v3:'v3 · OBTP Cassette 01'};
// Insert navigation beside the first design parameter without rewriting preserved v1 source.
function addVersion(frame){const doc=frame.contentDocument;if(!doc||doc.getElementById('studio-version'))return;const aside=doc.querySelector('aside');if(!aside)return;const field=doc.createElement('div');field.className='field';field.style.margin='18px 0';const label=doc.createElement('label');label.htmlFor='studio-version';label.textContent='Version';label.style.display='block';label.style.margin='0 0 8px';const select=doc.createElement('select');select.id='studio-version';select.style.cssText='font:inherit;width:100%;padding:10px;border:1px solid #b9c6a9;border-radius:7px;background:#fffef9;color:inherit';for(const [id,name]of Object.entries(labels))select.add(new Option(name,id));select.value=frame.id;select.onchange=()=>{location.hash=select.value;show();};field.append(label,select);const controls=aside.querySelector('.controls');if(controls)controls.prepend(field);else{const first=aside.querySelector('label');if(first)first.before(field);else aside.prepend(field);}}
for(const id of Object.keys(labels)){const frame=document.getElementById(id);frame.addEventListener('load',()=>addVersion(frame));}
function show(){const key=Object.hasOwn(labels,location.hash.slice(1))?location.hash.slice(1):'v2';for(const id of Object.keys(labels)){const frame=document.getElementById(id);frame.hidden=id!==key;if(id===key&&!frame.getAttribute('src'))frame.src=id+'/index.html?build=__STUDIO_BUILD__';}document.getElementById('current').textContent=labels[key];}
window.addEventListener('hashchange',show);show();
</script></body></html>
